name: VM2 Auto-Retry transfer destination canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vm2-g1-transfer-canary:
    name: vm2-g1-transfer-canary
    runs-on: ubuntu-latest
    steps:
      - name: Fail attempt one, succeed after Mergify rerun
        shell: bash
        run: |
          set -euo pipefail
          echo "run_attempt=$GITHUB_RUN_ATTEMPT"
          if [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo VM2_G1_TRANSFER_ATTEMPT_ONE_FAILURE
            exit 1
          fi
          echo VM2_G1_TRANSFER_RERUN_SUCCESS
